# Unofficial bridge: mirrors surfrpt1/procraft releases for Craft Unofficial Launcher.
# Run by https://github.com/YalKouassi/craft-bridge (its README explains every key).

[bridge]
upstream = "surfrpt1/procraft"
repo = "YalKouassi/procraft-for-unofficial-launcher"
# Upstream publishes no checksum file; GitHub's own asset digests are checked.
# Not mirrored: the Android and iOS builds.
skip = ['\.apk$', '\.ipa$']

[descriptor]
id = "procraft"
name = "ProCraft"
tagline = "Raster painting studio in pure Rust: layered painting, brushes and canvas"
publisher = "surfrpt1"
bundle_id = "com.surfrpt1.procraft"   # upstream's Android package and iOS CFBundleIdentifier
website = "https://github.com/surfrpt1/procraft"
color = "#0b3d3a"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/icon-256.png"

# A flat zip with procraft.exe at its root: only renamed (the "v" in its name is dropped).
[[rename]]
match = 'procraft-v(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-x64\.zip'
to = '{id}-{version}-windows-x64-portable.zip'
